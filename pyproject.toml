[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphometry-preflight"
version = "0.1.0"
description = "Read-only calibration and mask checks before 2D microscopy morphometry"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aymen Benalia"}]
dependencies = ["numpy>=1.24,<3", "pandas>=2,<4", "Pillow>=10,<13"]

[project.scripts]
morphometry-preflight = "morphometry_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
